<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Skill_X_Light.png" id="app-favicon" />
    <link rel="apple-touch-icon" href="/Skill_X_Light.png" id="app-apple-icon" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('skillx_theme') || 'light';
          document.documentElement.setAttribute('data-theme', saved);
          var iconUrl = saved === 'dark' ? '/Skill_X_Dark.png' : '/Skill_X_Light.png';
          var favicon = document.getElementById('app-favicon');
          if (favicon) favicon.href = iconUrl;
          var appleIcon = document.getElementById('app-apple-icon');
          if (appleIcon) appleIcon.href = iconUrl;
        } catch(e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Skill X — Exchange skills, grow together. A peer-to-peer skill exchange platform with intelligent matching, encrypted messaging, and HD video sessions." />
    <meta name="theme-color" content="#ffffff" />
    <title>Skill X — Exchange Skills, Grow Together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
